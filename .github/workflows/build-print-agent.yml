name: Build Windows Print Agent
on:
  push:
    branches: [main]
    paths:
      - 'print-agent/**'
      - '.github/workflows/build-print-agent.yml'
  pull_request:
    branches: [main]
    paths:
      - 'print-agent/**'
      - '.github/workflows/build-print-agent.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: print-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm test
      - shell: pwsh
        run: "[void][scriptblock]::Create((Get-Content -Raw ./print-raw.ps1))"
      - run: node --check server.js
      - run: node --check standalone.js
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with:
          name: CocktailloPrintAgent-Windows
          path: print-agent/dist/CocktailloPrintAgent.exe
          if-no-files-found: error
